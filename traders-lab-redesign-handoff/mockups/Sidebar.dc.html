<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#E8ECEA;text-decoration:none}a:hover{color:#C6F432}</style>
</helmet>
<nav aria-label="Main" style="width: 100%; min-height: 860px; box-sizing: border-box; padding: 24px 14px; background: #0B0D0C; color: #E8ECEA; font-family: Inter, sans-serif; font-size: 14px; display: flex; flex-direction: column; gap: 18px; border-right: 1px solid #1C221F;">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 8px;">
<div style="display: flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px;">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="7" width="3" height="8" fill="#F5913E"></rect><rect x="6" y="3" width="3" height="12" fill="#E9C46A"></rect><rect x="11" y="5" width="3" height="10" fill="#6F8FFF"></rect></svg>
<span>Traders Lab.</span>
</div>
<div style="font-size: 12px; color: #8E9692;">Paper desk · 5 traders</div>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 12px; color: #8E9692; padding: 4px 8px;">{{g.label}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" style="{{it.style}}">{{it.label}}</a>
</sc-for>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px; font-size: 12px; color: #8E9692;">
<div style="display: flex; align-items: center; gap: 6px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #8E9692;"></span>Market closed</div>
<button type="button" style="align-self: flex-start; background: transparent; color: #E8ECEA; border: 1px solid #2A322E; border-radius: 6px; padding: 8px 12px; font: inherit; min-height: 36px;">Light theme</button>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Money","Trades","Researcher","Decisions","Lessons","Memory","Market Year","Experiments","Failures","Health"],"default":"Money"},"$preview":{"width":220,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'Money';
const files = { 'Money': 'Main.dc.html', 'Trades': 'Trades.dc.html', 'Decisions': 'Decisions.dc.html', 'Market Year': 'MarketStory.dc.html', 'Researcher': 'Researcher.dc.html', 'Health': 'Health.dc.html' };
const mk = (label) => ({
label,
href: files[label] || '#',
style: 'display:block;padding:9px 8px;border-radius:6px;' + (label === active ? 'background:#1B211E;color:#C6F432;font-weight:600;' : '')
});
return { groups: [
{ label: 'Desk', items: ['Money', 'Trades'].map(mk) },
{ label: 'Why it traded', items: ['Researcher', 'Decisions', 'Lessons', 'Memory', 'Market Year'].map(mk) },
{ label: 'Lab', items: ['Experiments', 'Failures', 'Health'].map(mk) }
] };
}
}
</script>
</body>
</html>
